name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  semantic-model:
    name: Semantic model (TMDL + DAX checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - name: Validate model
        run: dotnet run --project tools/ModelValidator -- SalesAnalytics.SemanticModel/definition

  pbip-files:
    name: Report and PBIP files match the Microsoft schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate every JSON artifact against its $schema
        run: |
          pip install --quiet jsonschema
          python tools/validate_pbir.py

  sample-data:
    name: Sample marts are reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Rebuild from the pipeline repository and compare
        run: |
          python scripts/build_sample_marts.py
          git diff --exit-code -- sample-data

  best-practices:
    name: Best-practice checks (pbip-doc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: adonaismarrero/pbip-documenter@v1
        with:
          path: SalesAnalytics.pbip
          fail-on: warning
