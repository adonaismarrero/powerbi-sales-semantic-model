name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  semantic-model:
    name: Semantic model (TMDL + DAX checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - name: Validate model
        run: dotnet run --project tools/ModelValidator -- SalesAnalytics.SemanticModel/definition

  pbip-files:
    name: PBIP files are valid JSON
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Parse JSON artifacts (pbip, pbism, pbir, .platform, PBIR report)
        run: |
          find . -path ./.git -prune -o -type f \( -name "*.json" -o -name "*.pbip" -o -name "*.pbir"                -o -name "*.pbism" -o -name ".platform" \) -print | sort | while read -r f; do
            python3 -m json.tool "$f" > /dev/null || { echo "INVALID $f"; exit 1; }
            echo "OK  $f"
          done

  sample-data:
    name: Sample marts are reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Rebuild from the pipeline repository and compare
        run: |
          python scripts/build_sample_marts.py
          git diff --exit-code -- sample-data
